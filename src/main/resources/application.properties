spring.application.name=login-security
spring.datasource.url=jdbc:mariadb://localhost:3306/login_security
spring.datasource.username=root
spring.datasource.password=root
spring.flyway.enabled=true

# Duración predeterminada de los tokens de autenticación.
app.auth.access-token-ttl=PT15M
app.auth.refresh-token-ttl=P30D

# Configuración de JWT (access token autocontenido firmado con HS256).
# En producción debe definirse mediante la variable de entorno JWT_SECRET (mínimo 256 bits).
app.jwt.secret=${JWT_SECRET:U2VjcmV0byBkZSBkZXNhcnJvbGxvIHBhcmEgSldUIHNlZ3VybyBkZSAzMiBieXRlcw==}
app.jwt.issuer=login-security
